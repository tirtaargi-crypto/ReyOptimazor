name: Build ReyOptimazor from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -maxdepth 1 -type f -iname "*.zip" -print)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "No project ZIP found in repository root."
            exit 1
          fi
          if [ "${#zips[@]}" -gt 1 ]; then
            echo "More than one ZIP found:"
            printf '%s\n' "${zips[@]}"
            exit 1
          fi
          echo "zip_path=${zips[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q "${{ steps.zip.outputs.zip_path }}" -d project

      - name: Locate Gradle root
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle(.kts) not found."
            exit 1
          fi
          DIR="$(dirname "$SETTINGS")"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          test -d "$DIR/app"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Create wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReyOptimazor-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
